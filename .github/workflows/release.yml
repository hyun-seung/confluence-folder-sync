name: Release
on:
  push:
    tags: ['[0-9]*.[0-9]*.[0-9]*']
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  checks:
    uses: ./.github/workflows/ci.yml
    permissions:
      contents: read
  release:
    needs: checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Build exact tag and package public files
        shell: bash
        run: |
          set -euo pipefail
          node build.cjs
          git diff --exit-code -- main.js THIRD_PARTY_NOTICES.txt
          python3 tools/release.py --tag "$GITHUB_REF_NAME" --output .release/assets --notes .release/notes.md
      - name: Attest release assets
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: '.release/assets/*'
      - name: Create or resume a verified draft and publish
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 tools/publish_release.py --tag "$GITHUB_REF_NAME" --commit "$GITHUB_SHA" --repo "$GITHUB_REPOSITORY" --assets .release/assets --notes .release/notes.md
